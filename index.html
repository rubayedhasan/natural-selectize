<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natural Selectize</title>

    <!-- Linked custom stylesheet  -->
    <link rel="stylesheet" href="./css/natural-selectize.css" />

    <style>
      form {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Select</h1>

    <form action="">
      <div class="form-field">
        <label for="se1">Single select</label>
        <select name="se1" id="se1" class="natural-selectize">
          <option value="">-- Select Value --</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>

        <!-- selectize contoller container  -->
        <div class="natural-selectize-container">
          <!--selectize controller  -->
          <div class="natural-selectize-controller">
            <!-- selected  option badge  -->
            <div class="ns-selected-option-badge">
              <span class="ns-badge-option">Badge Op</span>
              <button type="button" class="ns-badge-remove-btn">×</button>
            </div>

            <!-- search input  -->
            <input
              type="text"
              name=""
              id="NsInputSearch"
              class="ns-action-input"
              placeholder="Type..."
            />
            <!-- remove button main  -->
            <button type="button" class="ns-controll-remove-btn">×</button>
          </div>

          <!-- selectize dropdown  -->
          <div class="natural-selectize-dropdown">
            <div class="ns-dropdown-options">
              <div class="ns-dropdown-option">Option 1</div>
              <div class="ns-dropdown-option">Option 2</div>
              <div class="ns-dropdown-option">Option 3</div>
              <div class="ns-dropdown-option">Option 4</div>
              <div class="ns-dropdown-option">Option 5</div>

              <!-- opt group  -->
              <div class="ns-dropdown-optionGroup">
                <div class="ns-dropdown-option-header">header</div>
                <div class="ns-dropdown-option">Option 1</div>
                <div class="ns-dropdown-option">Option 2</div>
                <div class="ns-dropdown-option">Option 3</div>
                <div class="ns-dropdown-option">Option 4</div>
                <div class="ns-dropdown-option">Option 5</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- empty cell  -->
      <div class="form-field"></div>
      <div class="form-field"></div>
      <div class="form-field"></div>
      <div class="form-field"></div>
      <div class="form-field">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>

    <!-- Linked custom script  -->
    <script src="./js/natural-selectize.js"></script>
  </body>
</html>
